version: '3.8'

services:
  # Redis service for distributed locking (Flash Sale)
  redis:
    image: redis:alpine
    container_name: melotix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # (Optional) MongoDB service for local development
  mongodb:
    image: mongo:latest
    container_name: melotix-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
